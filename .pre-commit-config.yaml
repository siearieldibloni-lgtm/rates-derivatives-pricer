# Fast local checks run on every `git commit` (install once with `uv run pre-commit install`).
# Hooks call the tools pinned in uv.lock, so local and CI versions never drift apart.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (layer rule)
        entry: uv run lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest-unit
        name: pytest (unit tests)
        entry: uv run pytest tests/unit -q
        language: system
        types_or: [python, pyi]
        pass_filenames: false
