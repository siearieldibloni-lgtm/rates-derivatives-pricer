# The whole platform in one command: `docker compose up` (API on :8000, dashboard on :8501).
# `docker compose up -d --wait` returns once both containers report healthy (used by the CI).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: rate-derivatives-pricer-api:local
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      CURVE_CACHE_SIZE: "32"
      LOG_BUFFER_SIZE: "10000"
      LOG_BUFFER_LEVEL: INFO
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: rate-derivatives-pricer-ui:local
    ports:
      - "8501:8501"
    environment:
      # Service name of the API on the compose network.
      PRICER_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
