name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, layers, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 1. Install the exact locked environment (all layers + dev tooling).
      - name: uv sync
        run: uv sync --locked --all-extras

      # 2. Style.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

      # 3. Types (strict on core/ and services/).
      - name: mypy
        run: uv run mypy

      # 4. Layer dependency rule: a forbidden import fails the build.
      - name: import-linter
        run: uv run lint-imports

      # 5. Tests with coverage.
      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      # 7. Coverage report as a build artifact.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
